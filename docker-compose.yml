services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install && pnpm prisma generate && pnpm dev"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://lavander:password@db:5432/lavander
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=lavander
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lavander
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavander -d lavander"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  node_modules:
